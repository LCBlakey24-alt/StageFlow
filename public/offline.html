<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071527" />
  <title>Stage Flow — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fbff;color:#071527;font-family:Inter,system-ui,sans-serif}
    .card{width:min(520px,100%);background:#fff;border:1px solid #dbe7f3;border-radius:22px;padding:24px;box-shadow:0 14px 34px rgba(7,21,39,.09);position:relative;overflow:hidden}
    .card:after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#1d4ed8 0%,#0ea5e9 30%,#facc15 55%,#f97316 76%,#ef4444 100%)}
    h1{margin:0 0 8px;font-size:30px}p{margin:0;color:#60738a;font-weight:700;line-height:1.5}
    button{margin-top:18px;width:100%;border:0;border-radius:14px;padding:12px;background:#071527;color:#fff;font-weight:900}
  </style>
</head>
<body>
  <main class="card">
    <h1>Stage Flow is offline</h1>
    <p>Reconnect to the internet and try again. No learner or session data is stored in this offline page.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
