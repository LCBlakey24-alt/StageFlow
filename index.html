<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071527" />
    <meta name="description" content="Stage Flow — timetables, attendance, notes and optional assessment for coached activities." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stage Flow" />
    <meta name="stageflow-build-note" content="cloud-accounts-pwa-2026-10-02" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/branding/StageFlow_AppIcon_Concept01.png" />
    <link rel="apple-touch-icon" href="/branding/StageFlow_AppIcon_Concept01.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />

    <style>
      .brand,
      .hero h1,
      main > .card h1 {
        font-family: 'Audiowide', Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.025em;
      }
      .hero h1 { line-height: 1.08; }
      @media (max-width: 850px) {
        .rail button:nth-child(2):after {
          content: 'Timetable' !important;
          font-size: 9px !important;
        }
      }
    </style>
    <title>Stage Flow — Teach. Track. Progress.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener('click', function (event) {
        const button = event.target.closest('button');
        if (!button) return;
        const label = (button.textContent || '').trim().toLowerCase();
        const isReset = label === 'reset' || label === 'reset app data';
        const isDelete = label === 'delete';
        if (isReset && !window.confirm('Reset Stage Flow demo data on this device? This clears your local test changes.')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
        if (isDelete && !window.confirm('Delete this class/session and its linked swimmers from this demo?')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <script type="module" src="/app/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/stage-flow-sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function (registration) { return registration.update(); })
            .catch(function (error) { console.warn('Stage Flow app install worker unavailable', error); });
        });
      }
    </script>
  </body>
</html>
