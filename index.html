    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || '');
        var forceReset = params.has('reset') || params.has('fresh');
        var resetKey = 'stageflow-cache-reset-complete';

        function clearBrowserCaches() {
          var jobs = [];
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                  return Promise.all(registrations.map(function (registration) {
                    return registration.unregister();
                  }));
                })
                .catch(function () {})
            );
          }
          if (window.caches && window.caches.keys) {
            jobs.push(
              window.caches.keys()
                .then(function (keys) {
                  return Promise.all(keys.map(function (key) {
                    return window.caches.delete(key);
                  }));
                })
                .catch(function () {})
            );
          }
          return Promise.all(jobs);
        }

        clearBrowserCaches().then(function () {
          if (forceReset && !window.sessionStorage.getItem(resetKey)) {
            window.sessionStorage.setItem(resetKey, '1');
            window.location.replace('/?fresh=' + Date.now());
          }
        });
      }());
    </script>

  <body>
    <div id="root"></div>
    <script>
      document.addEventListener('click', function (event) {
        const button = event.target.closest('button');
        if (!button) return;
        const label = (button.textContent || '').trim().toLowerCase();
        const isReset = label === 'reset' || label === 'reset app data';
        const isDelete = label === 'delete';
        if (isReset && !window.confirm('Reset Stage Flow demo data on this device? This clears your local test changes.')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
        if (isDelete && !window.confirm('Delete this class/session and its linked swimmers from this demo?')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
